[package]
name = "app"
version = "0.1.0"
description = "Creador de Currículums - generador de CVs 100% local"
authors = ["victoramos2727@gmail.com"]
license = "MIT"
repository = "https://github.com/XIIRAD2/CreadorDeCurriculums"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
